<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
<h1>Crear Cuenta</h1>

<form th:action="@{/registro}" th:object="${usuario}" method="post">
    <div>
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required />
        <span th:if="${#fields.hasErrors('nombre')}"
              th:errors="*{nombre}" style="color:red"></span>
    </div>
    <div>
        <label>Correo:</label>
        <input type="email" th:field="*{email}" required />
        <span th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}" style="color:red"></span>
    </div>
    <div>
        <label>Contraseña:</label>
        <input type="password" th:field="*{contrasenia}" required />
    </div>
    <button type="submit">Registrarse</button>
</form>

<a th:href="@{/login}">¿Ya tiene cuenta? Inicie sesión</a>
</body>
</html>
